<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusOS · Complete CRM Screenshot Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'DM Sans', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 32px 24px; }
    header {
      max-width: 1400px;
      margin: 0 auto 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid #334155;
      padding-bottom: 24px;
    }
    h1 {
      font: 800 28px Manrope, sans-serif;
      letter-spacing: -0.5px;
      color: #fff;
    }
    p.sub {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 6px;
    }
    .badge {
      background: #3b82f6;
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }
    .gallery {
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }
    .img-wrap {
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.2s;
    }
    .card:hover .img-wrap img {
      transform: scale(1.02);
    }
    .card-info {
      padding: 16px;
    }
    .card-info h3 {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 4px;
    }
    .card-info p {
      font-size: 12px;
      color: #94a3b8;
    }
    a.view-btn {
      display: inline-block;
      margin-top: 10px;
      color: #60a5fa;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
    a.view-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CampusOS · School CRM Feature Screenshots</h1>
      <p class="sub">71 comprehensive high-resolution screenshots covering every function, drawer, view, filter, modal, and responsive viewport.</p>
    </div>
    <div class="badge">71 Screenshots</div>
  </header>
  <div class="gallery" id="gallery"></div>

      ["64_settings_school_profile.png", "Settings · School Profile", "Institution profile and demo environment options"],
      ["65_settings_reset_confirm_modal.png", "Settings · Reset Demo Data Modal", "Sample data restoration confirmation modal"],
      ["66_campus_main_campus_filtered.png", "Campuses · Main Campus Filtered", "Records filtered strictly for Main Campus"],
      ["67_campus_west_campus_filtered.png", "Campuses · West Campus Filtered", "Records filtered strictly for West Campus"],
      ["68_mobile_overview_dashboard.png", "Mobile · Overview Dashboard", "Mobile viewport (390px) responsive leadership dashboard"],
      ["69_mobile_sidebar_navigation.png", "Mobile · Sidebar Navigation", "Sliding mobile menu for fast navigation on phone screens"],
      ["70_mobile_admissions_pipeline.png", "Mobile · Admissions Pipeline", "Mobile Kanban horizontal scrolling pipeline"],
      ["71_mobile_attendance_register.png", "Mobile · Attendance Register", "Mobile responsive weekly attendance register"]
    ];

    const gallery = document.getElementById('gallery');
    items.forEach(([file, title, desc]) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="img-wrap">
          <a href="${file}" target="_blank">
            <img src="${file}" alt="${title}" loading="lazy">
          </a>
        </div>
        <div class="card-info">
          <h3>${title}</h3>
          <p>${desc}</p>
          <a class="view-btn" href="${file}" target="_blank">Open Full Image ↗</a>
        </div>
      `;
      gallery.appendChild(card);
    });
  </script>
</body>
</html>
